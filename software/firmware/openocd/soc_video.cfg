# Native VexRiscv debug port from the imported hardjtag SoC (not RISC-V DMI).
# USER1 = instruction 8; Efinity EDB owns USER2.
# Windows Jim Tcl in vendor OpenOCD does not implement file normalize.
# Jim file dirname recognizes '/', so convert Windows '\' separators first.
set cfg_path [string map {\\ /} [info script]]
set app_dir [file dirname [file dirname $cfg_path]]
source [file join $app_dir .. bsp EfxSapphireSoc openocd ftdi_ti.cfg]
adapter speed 800
adapter srst delay 260
jtag_ntrst_delay 250
gdb_target_description disable
jtag newtap fpga_spinal bridge -expected-id $_CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF
target create fpga_spinal.cpu0 vexriscv -endian little -chain-position fpga_spinal.bridge -coreid 0 -dbgbase 0x10B80000 -work-area-phys 0xF9000000 -work-area-size 1024
vexriscv readWaitCycles 40
vexriscv cpuConfigFile [file join $app_dir cpu0.yaml]
vexriscv jtagMapping 8 8 0 1 2 2
poll_period 50
# Configuration-only validation executes this exact file, including path logic.
# Normal IDE launches do not define SOC_CONFIG_CHECK and connect to hardware.
if {[info exists SOC_CONFIG_CHECK] && $SOC_CONFIG_CHECK} {
    puts "SOC configuration check: init/halt skipped"
} else {
    init
    halt
}
