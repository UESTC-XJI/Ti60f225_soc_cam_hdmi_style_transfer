<text x="42.0" y="1546" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">量化（全部取自 spec.json，不手抄）</text>
<text x="42.0" y="1568" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 权重：int8 对称，逐张量 per-tensor</text>
<text x="42.0" y="1586" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 激活：uint8 非对称；ReLU 后非负 → zero-point 恒 0</text>
<text x="42.0" y="1604" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 累加器：int32，最坏 (ci·k·k)·255·127</text>
<text x="42.0" y="1622" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 残差相加的两支必须共用同一条 scale</text>
<text x="42.0" y="1640" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 残差 c1 的输入可能为负 → 该层转有符号 ±127</text>
<rect x="512.0" y="1520" width="460.0" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="526.0" y="1546" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">硬件要点（RTL 侧最容易接错的地方）</text>
<text x="526.0" y="1568" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 反射填充，不是零填充 —— 边界要自己算</text>
<text x="526.0" y="1586" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· InstanceNorm 已折进前一层卷积 → 硬件零成本</text>
<text x="526.0" y="1604" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 上采样在卷积之前，最近邻、无乘法</text>
<text x="526.0" y="1622" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 做的是相关，卷积核不翻转</text>
<text x="526.0" y="1640" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">· 边长必须 4 的倍数（两级 ↓2 × 两级 ↑2）</text>
</svg>